<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Download Appie</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #111;
    }

    p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .download-btn:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Apna logo yahan lagao -->
    <img src="logo.png" class="logo" alt="Appie Logo">

    <h1>Appie</h1>

    <p>
      Connect. Talk. Make new connections.<br>
      Download the latest version of Appie.
    </p>

    <!-- APNA APK LINK YAHAN DALO -->
    <a 
      href="https://drive.google.com/file/d/1xwkoYjc_acHXEkfNH-Bdgl_iiE5gO0IZ/view?usp=drivesdk"
      class="download-btn"
      download
    >
      📲 Download Appie
    </a>

    <div class="note">
      Android APK • Latest Version
    </div>

  </div>

</body>
</html>
